name: Build Psycho Beat Lab (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the download is named after the version in CMakeLists.txt (0.13.0 -> "BeatSlicer V13")
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(BeatSlicer VERSION 0\.(\d+)\.' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "name=BeatSlicer V$v" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target BeatSlicer_VST3 BeatSlicer_Standalone --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/BeatSlicer_artefacts/Release/VST3/PsychoBeatLab.vst3 out/
          Copy-Item build/BeatSlicer_artefacts/Release/Standalone/PsychoBeatLab.exe out/PsychoBeatLab_Standalone.exe
          Copy-Item installer/* out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: out
